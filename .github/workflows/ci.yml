name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Uji analitik (tanpa Measurement ID = no-op)
        run: node tools/uji-analytics.js
